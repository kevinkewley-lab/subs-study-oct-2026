<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // 3-way random split (~33.3% probability each)
    const rand = Math.random();
    let target = "no_subs.html";

    if (rand < 0.3333) {
      target = "english.html";
    } else if (rand < 0.6666) {
      target = "chinese.html";
    }

    // Preserve any URL parameters (e.g. subject IDs)
    const currentParams = window.location.search;
    window.location.replace(target + currentParams);
  </script>
</head>
<body>
  <p style="font-family: sans-serif; text-align: center; margin-top: 20%;">
    Assigning condition, please wait...
  </p>
</body>
</html>
